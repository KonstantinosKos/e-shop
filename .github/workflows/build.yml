name: Build and Deploy PHP to GitHub Pages

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'  # Use the PHP version you need

    - name: Run PHP to generate static files
      run: |
        mkdir dist
        # Convert all PHP files to HTML. You may need to customize this command.
        for file in src/*.php; do
          php "$file" > "dist/$(basename "${file%.php}.html")"
        done

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
